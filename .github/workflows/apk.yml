name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fixed signing key (so updates install over old version and keep data)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - name: Build Android project
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          NAME="$(tr -d '\r\n' < appname.txt 2>/dev/null || echo "$REPO")"
          ID="com.alrawais010.$(echo "$REPO" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9')"
          B="$RUNNER_TEMP/build"
          mkdir -p "$B/www"
          rsync -a --exclude '.git' --exclude '.github' ./ "$B/www/"
          cd "$B"
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          npx cap init "$NAME" "$ID" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/" app/build.gradle
          chmod +x gradlew
          KS="$HOME/.android/debug.keystore"
          ./gradlew assembleDebug -Pandroid.injected.signing.store.file="$KS" -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep SHA256 || true
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$REPO.apk"
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          gh release delete apk-latest -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest "$REPO.apk" --repo "$GITHUB_REPOSITORY" --title "APK" --notes "أحدث نسخة APK"
